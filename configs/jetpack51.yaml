version: 1

docker:
  image: "jetson-firmware-builder:35.2.1"
  dockerfile: "../docker/Dockerfile"
  build: true
  registry: ""
  privileged_for_flash: true
  devices:
    - "/dev/bus/usb"
  volumes:
    - "../build:/workspace/build"
  environment:
    JOBS: "8"

l4t:
  release: "35.6.4"
  bsp_url: "https://developer.nvidia.com/downloads/embedded/l4t/r35_release_v6.4/release/jetson_linux_r35.6.4_aarch64.tbz2"
  bsp_sha256: "3361faf48a8dea6fe15e9120b994d87e46b90c2aad0ed4dd3f8b7cdd65c7ad49"
  sample_rootfs_url: "https://developer.nvidia.com/downloads/embedded/l4t/r35_release_v6.4/release/tegra_linux_sample-root-filesystem_r35.6.4_aarch64.tbz2"
  sample_rootfs_sha256: "e268cec67d566dfe73fe5d6585a665dc3bf530ca6b5d6ae54029fd00b5d7bf73"

toolchain:
  name: "bootlin-gcc-9.3"
  url: "https://developer.nvidia.com/embedded/jetson-linux/bootlin-toolchain-gcc-93"
  sha256: "7725b4603193a9d3751d2715ef242bd16ded46b4e0610c83e76d8891cf580975"
  cross_compile_prefix: "aarch64-buildroot-linux-gnu-"

workspace:
  root: "/workspace/build"
  keep_intermediate: true

kernel:
  source_tag: "jetson_35.6.4"
  defconfig: "tegra_defconfig"

rootfs:
  install_modules: true
  extra_packages: []
  overlays:
    - src: "../fixtures/overlays/etc"
      dest: "/etc"

bsp:
  overlays: []

targets:
  - name: "xavier-nx"
    module: "p3668"
    flash_config: "jetson-xavier-nx-devkit-emmc"
    root_device: "mmcblk0p1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/xavier-carrier.dts"

  - name: "orin-nx"
    module: "p3767"
    flash_config: "jetson-orin-nano-devkit"
    root_device: "nvme0n1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/orin-carrier.dts"

  - name: "air-020"
    module: "p3668"
    flash_config: "jetson-xavier-nx-devkit-emmc"
    root_device: "nvme0n1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/air-020-carrier.dts"
    bsp:
      overlays:
        - src: "../fixtures/bootloader/air-020"
          dest: "/bootloader"

  - name: "air-021"
    module: "p3767"
    flash_config: "jetson-orin-nano-devkit"
    root_device: "nvme0n1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/air-021-carrier.dts"
    bsp:
      overlays:
        - src: "../fixtures/bootloader/air-021"
          dest: "/bootloader"
