version: 1

docker:
  image: "jetson-firmware-builder:35.2.1"
  dockerfile: "../docker/Dockerfile"
  build: true
  registry: ""
  privileged_for_flash: true
  devices:
    - "/dev/bus/usb"
  volumes:
    - "../build:/workspace/build"
  environment:
    JOBS: "8"

# https://developer.nvidia.com/embedded/jetson-linux-r3560
l4t:
  release: "35.6.0"
  bsp_url: "https://developer.nvidia.com/downloads/embedded/l4t/r35_release_v6.0/release/jetson_linux_r35.6.0_aarch64.tbz2"
  bsp_sha256: "1cc07ea946df064b1eb5d6ba8bc289d84e6b9f437b5f538e95a0d2ae6639e601"
  sample_rootfs_url: "https://developer.nvidia.com/downloads/embedded/l4t/r35_release_v6.0/release/tegra_linux_sample-root-filesystem_r35.6.0_aarch64.tbz2"
  sample_rootfs_sha256: "b4efbda585681111034ca84251116c3af85fb329c63ac4d25360216e807bc6a4"

toolchain:
  name: "bootlin-gcc-9.3"
  url: "https://developer.nvidia.com/embedded/jetson-linux/bootlin-toolchain-gcc-93"
  sha256: "7725b4603193a9d3751d2715ef242bd16ded46b4e0610c83e76d8891cf580975"
  cross_compile_prefix: "aarch64-buildroot-linux-gnu-"

workspace:
  root: "/workspace/build"
  keep_intermediate: true

kernel:
  source_tag: "jetson_35.6.4"
  defconfig: "tegra_defconfig"
  patches: []

rootfs:
  install_modules: true
  extra_packages: []
  overlays:
    - src: "../fixtures/overlays/etc"
      dest: "/etc"

bsp:
  overlays: []

targets:
  - name: "xavier-nx"
    module: "p3668"
    flash_config: "jetson-xavier-nx-devkit-emmc"
    root_device: "mmcblk0p1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/xavier-carrier.dts"

  - name: "orin-nx"
    module: "p3767"
    flash_config: "jetson-orin-nano-devkit"
    root_device: "nvme0n1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/orin-carrier.dts"

  - name: "air-020"
    module: "p3668"
    flash_config: "jetson-xavier-nx-devkit-emmc"
    root_device: "nvme0n1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/air-020-carrier.dts"
    bsp:
      overlays:
        - src: "../fixtures/bootloader/air-020"
          dest: "/bootloader"

  - name: "air-021"
    module: "p3767"
    flash_config: "jetson-orin-nano-devkit"
    root_device: "nvme0n1"
    enabled: true
    kernel:
      extra_dts:
        - "../fixtures/dts/air-021-carrier.dts"
    bsp:
      overlays:
        - src: "../fixtures/bootloader/air-021"
          dest: "/bootloader"
