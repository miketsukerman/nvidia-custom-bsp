[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "jetson-firmware-builder"
version = "0.1.0"
description = "Configuration-driven firmware builder for NVIDIA Jetson L4T R35.2.1"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Jetson Firmware Builder" }]
dependencies = [
  "pydantic>=2.9,<3",
  "ruamel.yaml>=0.18,<1",
  "typer>=0.12,<1",
  "rich>=13.7,<14",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "mypy>=1.11,<2",
  "ruff>=0.6,<1",
  "black>=24.8,<25",
]

[project.scripts]
jetson-fw = "jetson_fw.cli:app"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B027", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["jetson_fw"]

[tool.hatch.build.targets.wheel]
packages = ["src/jetson_fw"]
